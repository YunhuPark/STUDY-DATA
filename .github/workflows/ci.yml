name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_notebooks.py
